name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v

  document-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Document consistency checks (CI-safe, no local artifacts needed)
        run: python scripts/verify_public_document_consistency.py
      - name: Unreviewed taxonomy handoff integrity
        run: python scripts/verify_taxonomy_human_review_packet.py
      - name: Frozen config integrity
        run: |
          python -c "
          import json, pathlib
          cfg = pathlib.Path('configs/benchmark_release_v2.json')
          data = json.loads(cfg.read_text())
          assert data['result_label'] == 'stable_full_v2', 'label mismatch'
          sha = data['stable_synthetic_cases']['case_and_donor_sha256']
          assert sha.startswith('065b1b65'), 'case hash mismatch'
          print('Frozen config OK:', data['result_label'], sha[:16])
          "
      - name: Tracked evidence summary integrity
        run: |
          python -c "
          import json, pathlib
          s = json.loads(pathlib.Path('configs/current_evidence_summary_v2.json').read_text())
          assert s['schema_version'] == 3
          assert s['frozen_evidence']['tag'] == 'v0.3.2-evidence-final'
          assert s['frozen_evidence']['commit'] == '57d678ecabebff724d898abe626c9ef80538775b'
          assert s['frozen_evidence']['release_url'].endswith('/v0.3.2-evidence-final')
          assert s['data_gate']['eligible_anchors'] == 563
          assert s['data_gate']['anchors_with_three_distinct_physical_donors'] == 238
          assert s['real_event_audit']['complete_comparisons'] == 228
          assert s['evidence_tiers']['supported_candidate_discontinuity'] == 34
          assert s['external_document_review'] == {
            'reviewed_events': 20,
            'site_specific_dated_confirmations': 0,
          }
          assert s['interval_coverage']['fixed_weight_status'] == 'complete'
          assert s['interval_coverage']['selection_aware_status'] == 'infeasible_within_deadline'
          assert s['release_gate_target_checks'] == 35
          assert s['algorithm_superiority_claim'] is False
          assert len(s['artifact_sources']) >= 20
          assert all(len(item['sha256']) == 64 for item in s['artifact_sources'])
          print('Evidence summary OK:', s['evidence_version'])
          "
